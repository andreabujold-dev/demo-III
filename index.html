<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moneris — AI Product Selector</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
BASE (UNCHANGED — OLD UI KEPT)
========================= */

*, *::before, *::after {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --navy:#1B3A52;
  --navy-light:#2C5282;
  --red:#E74C3C;
  --cyan:#4A9FBE;
  --gray-light:#F5F5F5;
  --gray-med:#E8E8E8;
  --text-dark:#1B3A52;
  --text-gray:#666666;
  --white:#FFFFFF;
  --border:#D0D0D0;
  --transition:all .2s ease;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--white);
  color:var(--text-dark);
}

/* (YOUR FULL ORIGINAL CSS STAYS HERE — UNCHANGED) */

</style>
</head>

<body>

<!-- =========================
HEADER (UNCHANGED)
========================= -->

<div class="topbar-info">
  <a href="#">Call sales</a>
  <a href="#">Service Status</a>
  <a href="#">Contact us</a>
  <a href="#">About Moneris</a>
  <a href="#">Careers</a>
</div>

<div class="topbar">
  <svg class="logo-svg" viewBox="0 0 160 52">
    <text x="0" y="38" font-size="30" font-weight="700">Moneris</text>
  </svg>

  <div class="topbar-nav">
    <a>Solutions</a>
    <a>Industries</a>
    <a>Partners</a>
    <a>Resources</a>
  </div>

  <div class="topbar-right">
    <button class="btn-login">Login</button>
    <button class="btn-getstarted">Get Started</button>
  </div>
</div>

<div class="container">

<div class="hero">
  <h1>Moneris <span class="red">AI Product Selector</span></h1>
  <p>Describe your business and instantly get a recommended payment setup tailored to your industry.</p>
</div>

<div id="shell"></div>

</div>

<div class="footer">© 2026 Moneris Solutions Corporation</div>

<script>

/* =========================
PRODUCTS (OLD STRUCTURE KEPT)
========================= */

const P = {
goTerminal:{name:"Moneris Go Terminal",desc:"Portable smart terminal.",icon:"💳"},
goPlus:{name:"Moneris Go Plus",desc:"Smart POS with printer.",icon:"📱"},
goRetail:{name:"Moneris Go Retail",desc:"Retail POS system.",icon:"🛍️"},
totalCommerce:{name:"Moneris Total Commerce",desc:"Unified commerce platform.",icon:"🌐"},
goRestaurant:{name:"Moneris Go Restaurant",desc:"Restaurant POS system.",icon:"🍽️"},
touchBistro:{name:"Moneris + TouchBistro",desc:"Tableside restaurant payments.",icon:"🍷"},
monerisOnline:{name:"Moneris Online",desc:"Ecommerce payments.",icon:"💻"},
paydInvoicing:{name:"PAYD Invoicing",desc:"Remote invoicing solution.",icon:"📧"},
goPinPad:{name:"Moneris Go PIN Pad",desc:"Countertop payment device.",icon:"🔢"}
};

/* =========================
INDUSTRIES (OLD UI)
========================= */

const industries = {
homepage:{title:"Moneris AI Product Matcher",subtitle:"Describe your business and we’ll recommend the right setup."},
retail:{title:"Retail AI Advisor",subtitle:"Tell us about your retail business."},
restaurant:{title:"Restaurant AI Advisor",subtitle:"Tell us about your restaurant."},
health:{title:"Health & Beauty AI Advisor",subtitle:"Tell us about your business."},
enterprise:{title:"Enterprise AI Advisor",subtitle:"Tell us about your organization."},
professional:{title:"Professional Services AI Advisor",subtitle:"Tell us about your business."},
public:{title:"Public Sector AI Advisor",subtitle:"Tell us about your organization."},
nonprofit:{title:"Not-for-profit AI Advisor",subtitle:"Tell us about your mission."}
};

/* =========================
INIT
========================= */

renderAI("homepage");

/* =========================
NAV
========================= */

function startQuiz(industry){
  renderAI(industry);
  document.getElementById("shell").scrollIntoView({behavior:"smooth"});
}

/* =========================
AI RENDER (OLD UI + NEW UX ELEMENTS)
========================= */

function renderAI(industry){

const cfg = industries[industry];

document.getElementById("shell").innerHTML = `
<div class="card">

<div class="card-label">${industry.toUpperCase()}</div>

<div class="card-title">${cfg.title}</div>

<div class="card-subtitle">${cfg.subtitle}</div>

<textarea id="aiInput" class="form-input"
placeholder="Describe your business..."></textarea>

<div style="margin-top:18px;">
<button class="btn-submit" onclick="runAI('${industry}')">
Find my setup
</button>
</div>

</div>
`;
}

/* =========================
AI ENGINE (NEW LOGIC INJECTED INTO OLD SYSTEM)
========================= */

function runAI(industry){

const text = document.getElementById("aiInput").value.toLowerCase();
if(!text.trim()) return;

document.getElementById("shell").innerHTML = `
<div class="card">
<div class="card-title">Analyzing your business...</div>
<div class="pbar"><div class="pfill"></div></div>
</div>`;

setTimeout(()=>{

let recs = [];
let reasons = {};
let profile = {
industry,
channels:[],
goals:[],
size:"Small Business",
confidence:82
};

let enterprise =
text.includes("multi") ||
text.includes("franchise") ||
text.includes("enterprise") ||
text.includes("locations") ||
text.includes("chain");

/* PROFILE DETECTION (UPGRADED) */
if(text.includes("online") || text.includes("ecommerce")) profile.channels.push("Online");
if(text.includes("store") || text.includes("retail")) profile.channels.push("In-Store");
if(text.includes("grow") || text.includes("expand")) profile.goals.push("Growth");
if(text.includes("inventory")) profile.goals.push("Inventory");

if(enterprise){
profile.size = "Enterprise";
profile.confidence = 94;
}

/* =========================
INDUSTRY LOGIC (MERGED + IMPROVED)
========================= */

if(industry === "retail"){
recs = enterprise
? ["goPinPad","totalCommerce","goRetail"]
: ["goRetail","goTerminal","totalCommerce"];

reasons.goRetail = "Retail POS for in-store transactions and inventory tracking.";
reasons.totalCommerce = "Unified commerce for online + in-store sales.";
reasons.goTerminal = "Portable payment processing for flexibility.";
}

else if(industry === "restaurant"){
recs = ["goRestaurant","goTerminal"];

if(text.includes("tableside") || text.includes("fine dining")){
recs.unshift("touchBistro");
}

reasons.goRestaurant = "Built for restaurant workflows and ordering.";
reasons.goTerminal = "Portable payments for staff mobility.";
reasons.touchBistro = "Tableside ordering and restaurant management.";
}

else if(industry === "health"){
recs = ["goPlus","goTerminal"];

if(text.includes("retail") || text.includes("products")){
recs.unshift("goRetail");
}
}

else if(industry === "professional"){
recs = ["paydInvoicing","goTerminal"];

if(text.includes("remote") || text.includes("online")){
recs.unshift("monerisOnline");
}

reasons.paydInvoicing = "Remote invoicing for service-based businesses.";
}

else if(industry === "public"){
recs = ["goPinPad","monerisOnline","goTerminal"];
}

else if(industry === "nonprofit"){
recs = ["monerisOnline","paydInvoicing","goTerminal"];
}

else if(industry === "enterprise"){
recs = ["goPinPad","totalCommerce","monerisOnline"];
}

else{
if(text.includes("restaurant") || text.includes("cafe")) return runAI("restaurant");
if(text.includes("salon") || text.includes("spa")) return runAI("health");
return runAI("retail");
}

/* =========================
SUMMARY + SCORE (NEW UX ADDED)
========================= */

let summary =
`Your business operates in the ${industry} sector with ${
profile.channels.join(" + ") || "standard channels"}.
Focus areas: ${profile.goals.join(", ") || "core payments"}.`;

let score = 5;
if(profile.channels.length > 1) score += 2;
if(enterprise) score += 2;
if(profile.goals.length) score += 1;

/* =========================
RENDER RESULTS (OLD UI + NEW REASONING)
========================= */

renderResults(recs, profile, summary, score, reasons);

},1200);
}

/* =========================
RESULTS (OLD DESIGN + NEW ENGINE OUTPUT)
========================= */

function renderResults(recs, profile, summary, score, reasons){

const unique = [...new Set(recs)];

document.getElementById("shell").innerHTML = `

<div class="card">

<div class="card-label">AI ASSESSMENT</div>

<div class="card-subtitle">${summary}</div>

<div class="dvd"></div>

<div style="margin-bottom:16px;font-size:13px;line-height:1.8;">
<b>Industry:</b> ${profile.industry}<br>
<b>Channels:</b> ${profile.channels.join(", ") || "Unknown"}<br>
<b>Business Size:</b> ${profile.size}<br>
<b>Confidence:</b> ${profile.confidence}%<br>
</div>

<div class="dvd"></div>

<div class="card-title">Recommended setup</div>

<div class="product-grid">

${unique.map((k,i)=>{

const p = P[k];

return `
<div class="product-card ${i===0?'best':''}">

<div class="product-icon">${p.icon}</div>

<div class="product-name">${p.name}</div>

<div class="product-desc">${p.desc}</div>

<div style="font-size:12px;color:#4A9FBE;margin-bottom:10px;">
Match: ${95-(i*7)}%
</div>

<div style="font-size:12px;color:#666;margin-bottom:10px;">
${reasons[k] || "Recommended based on your profile."}
</div>

<button class="btn-primary">Learn more</button>
<button class="btn-outline">Talk to sales</button>

</div>`;
}).join("")}

</div>

<div class="dvd"></div>

<div class="card-title">Opportunity Score</div>

<div style="font-size:34px;font-weight:700;">
${score}/10
</div>

<div class="card-subtitle">
Based on complexity, channels, and growth signals.
</div>

<div style="margin-top:20px;display:flex;gap:10px;">
<button class="btn-outline" onclick="location.reload()">Try again</button>
</div>

</div>

`;
}

</script>

</body>
</html>
