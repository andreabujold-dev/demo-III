<html lang="en">
<head>

<style>

*, *::before, *::after {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --navy:#1B3A52;
  --navy-light:#2C5282;
  --red:#E74C3C;
  --cyan:#4A9FBE;
  --gray-light:#F5F5F5;
  --gray-med:#E8E8E8;
  --text-dark:#1B3A52;
  --text-gray:#666666;
  --white:#FFFFFF;
  --border:#D0D0D0;
  --transition:all .2s ease;
}

html{
  font-size:16px;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--white);
  color:var(--text-dark);
  min-height:100vh;
}

/* =========================================
TOP BAR
========================================= */

.topbar-info{
  display:flex;
  justify-content:flex-end;
  gap:2rem;
  padding:.75rem 2rem;
  background:var(--white);
  border-bottom:1px solid var(--gray-med);
  font-size:12px;
}

.topbar-info a{
  color:var(--text-dark);
  text-decoration:none;
  font-weight:500;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1rem 2rem;
  background:var(--white);
  border-bottom:1px solid var(--gray-med);
  position:sticky;
  top:0;
  z-index:100;
}

.logo-svg{
  height:36px;
  width:auto;
}

.topbar-nav{
  display:flex;
  align-items:center;
  gap:2.5rem;
  flex:1;
  margin-left:3rem;
  font-size:13px;
}

.topbar-nav a{
  color:var(--text-dark);
  text-decoration:none;
  font-weight:500;
  cursor:pointer;
}

.topbar-nav a::after{
  content:'▼';
  font-size:8px;
  margin-left:4px;
  opacity:.6;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:1rem;
}

/* =========================================
BUTTONS
========================================= */

.btn-login{
  color:var(--text-dark);
  border:1px solid var(--border);
  padding:8px 16px;
  border-radius:4px;
  background:var(--white);
  cursor:pointer;
  font-size:13px;
  font-weight:500;
  font-family:inherit;
}

.btn-getstarted{
  background:var(--red);
  color:var(--white);
  border:none;
  padding:8px 16px;
  border-radius:4px;
  font-weight:600;
  cursor:pointer;
  font-size:13px;
  font-family:inherit;
}

.btn-primary{
  background:var(--navy);
  color:var(--white);
  border:none;
  padding:10px 16px;
  border-radius:4px;
  font-weight:600;
  cursor:pointer;
  font-size:13px;
  width:100%;
  font-family:inherit;
}

.btn-outline{
  background:var(--white);
  color:var(--text-dark);
  border:1.5px solid var(--border);
  padding:10px 16px;
  border-radius:4px;
  font-weight:600;
  cursor:pointer;
  font-size:13px;
  width:100%;
  margin-top:8px;
  font-family:inherit;
}

.btn-submit{
  background:var(--red);
  color:var(--white);
  border:none;
  padding:12px 24px;
  border-radius:4px;
  font-weight:700;
  cursor:pointer;
  font-size:14px;
  font-family:inherit;
}

/* =========================================
LAYOUT
========================================= */

.container{
  max-width:1100px;
  margin:0 auto;
  padding:0 1.5rem;
}

.hero{
  background:linear-gradient(
    135deg,
    var(--navy) 0%,
    #0f2a3a 100%
  );

  color:var(--white);
  padding:4rem 2rem;
  margin:2rem 0;
  border-radius:8px;
  text-align:center;
}

.hero h1{
  font-size:42px;
  font-weight:700;
  margin-bottom:1rem;
}

.hero .red{
  color:var(--red);
}

.hero p{
  font-size:15px;
  max-width:700px;
  margin:0 auto;
  line-height:1.7;
  opacity:.9;
}

/* =========================================
CARDS
========================================= */

.card{
  background:var(--white);
  border:1px solid var(--gray-med);
  border-radius:8px;
  padding:2.5rem;
  margin-bottom:2rem;
  animation:fadeIn .25s ease;
}

.card-label{
  font-size:12px;
  color:var(--cyan);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.4px;
  margin-bottom:1rem;
}

.card-title{
  font-size:30px;
  font-weight:700;
  margin-bottom:.75rem;
  line-height:1.3;
}

.card-subtitle{
  font-size:14px;
  color:var(--text-gray);
  line-height:1.7;
  margin-bottom:1.5rem;
}

/* =========================================
INPUTS
========================================= */

.form-input{
  width:100%;
  padding:14px 16px;
  border:1.5px solid var(--border);
  border-radius:4px;
  font-size:14px;
  font-family:inherit;
  outline:none;
  transition:var(--transition);
}

.form-input:focus{
  border-color:var(--navy);
}

textarea.form-input{
  min-height:180px;
  resize:vertical;
  line-height:1.6;
}

/* =========================================
BADGES
========================================= */

.path-badge{
  display:inline-block;
  background:linear-gradient(
    135deg,
    var(--cyan),
    var(--navy)
  );

  color:var(--white);
  padding:5px 12px;
  border-radius:4px;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  margin-right:8px;
}

.ep-badge{
  display:inline-block;
  padding:5px 12px;
  border-radius:4px;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
}

.ep-g{
  background:#E8F5F0;
  color:#0A5C42;
}

.ep-b{
  background:#E6F1FB;
  color:#0C447C;
}

/* =========================================
PRODUCTS
========================================= */

.product-grid{
  display:grid;
  grid-template-columns:repeat(
    auto-fill,
    minmax(260px,1fr)
  );

  gap:1.25rem;
  margin:1.5rem 0;
}

.product-card{
  border:1px solid var(--gray-med);
  border-radius:8px;
  padding:1.75rem;
  text-align:center;
  background:var(--white);
  transition:all .25s ease;
}

.product-card:hover{
  transform:translateY(-3px);
}

.product-card.best{
  border-color:var(--cyan);
  box-shadow:0 4px 16px rgba(74,159,190,.15);
}

.product-badge{
  display:inline-block;
  background:var(--cyan);
  color:var(--white);
  padding:4px 10px;
  border-radius:4px;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  margin-bottom:1rem;
}

.product-icon{
  font-size:48px;
  margin-bottom:1rem;
}

.product-name{
  font-size:15px;
  font-weight:700;
  margin-bottom:.75rem;
}

.product-desc{
  font-size:13px;
  color:var(--text-gray);
  line-height:1.6;
  margin-bottom:1.5rem;
  min-height:60px;
}

/* =========================================
INDUSTRIES
========================================= */

.industry-section{
  margin:2rem 0;
}

.section-title{
  font-size:22px;
  font-weight:700;
  text-align:center;
  margin-bottom:1.5rem;
}

.section-title .red{
  color:var(--red);
}

.industry-grid{
  display:grid;
  grid-template-columns:repeat(
    auto-fill,
    minmax(280px,1fr)
  );

  gap:1.25rem;
}

.industry-card{
  border:1px solid var(--gray-med);
  border-radius:8px;
  padding:1.5rem;
  background:var(--white);
  text-align:left;
  cursor:pointer;
  transition:var(--transition);
  font-family:inherit;
}

.industry-card:hover{
  border-color:var(--cyan);
  box-shadow:0 4px 16px rgba(74,159,190,.15);
}

.industry-icon{
  font-size:32px;
  margin-bottom:.75rem;
}

.industry-name{
  font-size:15px;
  font-weight:700;
  margin-bottom:.5rem;
}

.industry-desc{
  font-size:13px;
  color:var(--text-gray);
  line-height:1.6;
}

.industry-cta{
  display:inline-block;
  margin-top:1rem;
  color:var(--navy);
  font-weight:600;
  font-size:13px;
}

/* =========================================
PROGRESS
========================================= */

.pbar{
  height:4px;
  background:var(--gray-med);
  border-radius:2px;
  overflow:hidden;
  margin-top:1rem;
}

.pfill{
  height:100%;
  width:100%;
  background:linear-gradient(
    90deg,
    var(--cyan),
    var(--navy)
  );

  animation:loadBar 1.2s ease;
}

/* =========================================
MISC
========================================= */

.dvd{
  height:1px;
  background:var(--gray-med);
  margin:1.75rem 0;
}

.footer{
  background:var(--gray-light);
  padding:2rem;
  text-align:center;
  font-size:12px;
  color:var(--text-gray);
  border-top:1px solid var(--gray-med);
  margin-top:3rem;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes loadBar{
  from{
    width:0;
  }
}

@media(max-width:768px){

  .topbar-nav{
    display:none;
  }

  .hero h1{
    font-size:30px;
  }

  .card{
    padding:1.5rem;
  }

  .industry-grid,
  .product-grid{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<script>

/* =========================================

const P = {

goTerminal:{
name:"Moneris Go Terminal",
desc:"Portable smart terminal for modern businesses.",
icon:"💳"
},

goPlus:{
name:"Moneris Go Plus",
desc:"Smart POS with built-in printer and touchscreen.",

goRetail:{

totalCommerce:{

goRestaurant:{

},

/* =========================================
INDUSTRIES
========================================= */

const industries = {

homepage:{
title:"Moneris AI Product Matcher",
subtitle:"Describe your business and we’ll recommend the right setup."
},

retail:{
title:"Retail AI Advisor",
subtitle:"Tell us about your retail business."
},

restaurant:{
title:"Restaurant AI Advisor",
subtitle:"Tell us about your restaurant."
},

health:{
title:"Health & Beauty AI Advisor",
subtitle:"Tell us about your salon, spa, or clinic."
},

enterprise:{
title:"Enterprise AI Advisor",
subtitle:"Tell us about your organization."
},

professional:{
title:"Professional Services AI Advisor",
subtitle:"Tell us about your business."
},

public:{
title:"Public Sector AI Advisor",
subtitle:"Tell us about your organization."
},

nonprofit:{
title:"Not-for-profit AI Advisor",
subtitle:"Tell us about your mission."
}

};

/* =========================================
INIT
========================================= */

renderAI("homepage");

/* =========================================
INDUSTRY NAV
========================================= */

function startQuiz(industry){

renderAI(industry);

document.getElementById("shell")
.scrollIntoView({
behavior:"smooth"
});

}

/* =========================================
RENDER AI
========================================= */

function renderAI(industry){

const cfg = industries[industry];

document.getElementById("shell").innerHTML = `

<div class="card">

<div class="card-label">
${industry === "homepage"
? "AI EXPERIENCE"
: industry.toUpperCase()}
</div>

<div class="card-title">
${cfg.title}
</div>

<div class="card-subtitle">
${cfg.subtitle}
</div>

<div style="
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:18px;
">

<span class="path-badge">
AI powered
</span>

</div>

<textarea
id="aiInput"
class="form-input"
placeholder="Describe your business, goals, current setup, and what you're looking for..."
></textarea>

<div style="
display:flex;
gap:10px;
margin-top:18px;
flex-wrap:wrap;
">

<button
class="btn-submit"
onclick="runAI('${industry}')"
>
Find my setup
</button>

${
industry !== "homepage"
? `
<button
class="btn-outline"
style="width:auto;"
onclick="renderAI('homepage')"
>
Back to homepage
</button>
`
: ``
}

</div>

</div>

`;

}
/* =========================================
AI INTELLIGENCE LAYER (ADD ONLY)
========================================= */

function analyzeBusiness(text){

  const size = detectSize(text);
  const channels = detectChannels(text);
  const needs = detectNeeds(text);
  const inferredIndustry = detectIndustry(text);

  const confidence = calculateConfidence({ size, channels, needs, inferredIndustry });
  const summary = buildSummary({ size, channels, needs, inferredIndustry });
  const opportunity = calculateOpportunity({ size, channels, needs });

  return {
    size,
    channels,
    needs,
    inferredIndustry,
    confidence,
    summary,
    opportunity
  };
}

/* SIZE */
function detectSize(text){
  if(/enterprise|global/.test(text)) return "enterprise";
  if(/multi|locations|franchise|chain/.test(text)) return "mid-market";
  return "small";
}

/* CHANNELS */
function detectChannels(text){
  let c = [];
  if(/online|ecommerce|website/.test(text)) c.push("online");
  if(/store|in-store|retail|location/.test(text)) c.push("in-store");
  return c.length ? c : ["in-store"];
}

/* NEEDS */
function detectNeeds(text){
  let n = [];
  if(/grow|expand|scale/.test(text)) n.push("growth");
  if(/inventory|stock/.test(text)) n.push("inventory");
  if(/mobile|tablet/.test(text)) n.push("mobility");
  if(/invoice|billing|payments|remote/.test(text)) n.push("invoicing");
  return n;
}

/* INDUSTRY AUTO-ROUTING */
function detectIndustry(text){
  if(/restaurant|cafe/.test(text)) return "restaurant";
  if(/salon|spa/.test(text)) return "health";
  if(/consult|agency/.test(text)) return "professional";
  if(/donation|charity/.test(text)) return "nonprofit";
  return "retail";
}

/* CONFIDENCE */
function calculateConfidence(p){
  let score = 0;
  if(p.size) score++;
  if(p.channels.length) score++;
  if(p.needs.length) score++;
  if(p.inferredIndustry) score++;
  return Math.round((score/4)*100);
}

/* SUMMARY */
function buildSummary(p){
  return `${capitalize(p.size)} ${p.inferredIndustry} business operating ${p.channels.join(" & ")} with focus on ${p.needs.join(", ") || "payments"}.`;
}

/* OPPORTUNITY */
function calculateOpportunity(p){
  let score = 0;
  if(p.size === "enterprise") score += 3;
  else if(p.size === "mid-market") score += 2;
  else score += 1;

  score += p.channels.length;
  score += p.needs.length;

  return score;
}

function capitalize(s){
  return s.charAt(0).toUpperCase() + s.slice(1);
}
/* =========================================
AI ENGINE
========================================= */

function runAI(industry){

const text = document
.getElementById("aiInput")
.value
.toLowerCase();
const profile = analyzeBusiness(text);

if(!text.trim()) return;

document.getElementById("shell").innerHTML = `

<div class="card">

<div class="card-label">
AI ANALYSIS
</div>

<div class="card-title">
Analyzing your business...
</div>

<div class="card-subtitle">
Matching your needs against Moneris solutions.
</div>

<div class="pbar">
<div class="pfill"></div>
</div>

</div>

`;

setTimeout(()=>{

let recs = [];
let enterprise = profile.size === "enterprise";

/* ENTERPRISE DETECTION */

if(
text.includes("multi") ||
text.includes("locations") ||
text.includes("enterprise") ||
text.includes("franchise") ||
text.includes("chain")
){
enterprise = true;
}

/* RETAIL */

if(industry === "retail"){

recs.push("goRetail");
recs.push("goTerminal");

if(
text.includes("online") ||
text.includes("ecommerce")
){
recs.unshift("totalCommerce");
}

if(enterprise){
recs.unshift("goPinPad");
}

}

/* RESTAURANT */

else if(industry === "restaurant"){

recs.push("goRestaurant");
recs.push("goTerminal");

if(
text.includes("tableside") ||
text.includes("fine dining")
){
recs.unshift("touchBistro");
}

}

/* HEALTH */

else if(industry === "health"){

recs.push("goPlus");
recs.push("goTerminal");

if(
text.includes("retail") ||
text.includes("products")
){
recs.unshift("goRetail");
}

}

/* PROFESSIONAL */

else if(industry === "professional"){

recs.push("paydInvoicing");
recs.push("goTerminal");

if(
text.includes("remote") ||
text.includes("online")
){
recs.unshift("monerisOnline");
}

}

/* PUBLIC */

else if(industry === "public"){

recs.push("goPinPad");
recs.push("monerisOnline");
recs.push("goTerminal");

}

/* NONPROFIT */

else if(industry === "nonprofit"){

recs.push("monerisOnline");
recs.push("paydInvoicing");
recs.push("goTerminal");

}

/* ENTERPRISE */

else if(industry === "enterprise"){

enterprise = true;

recs.push("goPinPad");
recs.push("totalCommerce");
recs.push("monerisOnline");

}

/* HOMEPAGE */

else{
runAI(profile.inferredIndustry);
return;
}

renderResults(recs, enterprise, industry, profile);

},1400);

}
  
function getReason(key, profile){

if(key === "goRetail") return "Strong match for inventory-heavy retail operations";
if(key === "totalCommerce") return "Supports both online and in-store sales";
if(key === "monerisOnline") return "Best for ecommerce and online payments";
if(key === "paydInvoicing") return "Ideal for invoicing and remote billing";
if(key === "goTerminal") return "Flexible mobile payment solution";
if(key === "goPinPad") return "Built for enterprise scale environments";
if(key === "goRestaurant") return "Designed for restaurant workflows";

return "General fit based on your business profile";
