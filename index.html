<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moneris — AI Product Selector</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================
YOUR ORIGINAL STYLING — UNTOUCHED
========================================= */

*, *::before, *::after {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --navy:#1B3A52;
  --navy-light:#2C5282;
  --red:#E74C3C;
  --cyan:#4A9FBE;
  --gray-light:#F5F5F5;
  --gray-med:#E8E8E8;
  --text-dark:#1B3A52;
  --text-gray:#666666;
  --white:#FFFFFF;
  --border:#D0D0D0;
  --transition:all .2s ease;
}

html{ font-size:16px; }

body{
  font-family:'Inter',sans-serif;
  background:var(--white);
  color:var(--text-dark);
  min-height:100vh;
}

/* =========================================
TOP BAR (UNCHANGED)
========================================= */

.topbar-info{
  display:flex;
  justify-content:flex-end;
  gap:2rem;
  padding:.75rem 2rem;
  background:var(--white);
  border-bottom:1px solid var(--gray-med);
  font-size:12px;
}

.topbar-info a{
  color:var(--text-dark);
  text-decoration:none;
  font-weight:500;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1rem 2rem;
  background:var(--white);
  border-bottom:1px solid var(--gray-med);
  position:sticky;
  top:0;
  z-index:100;
}

.logo-svg{ height:36px; }

.topbar-nav{
  display:flex;
  gap:2.5rem;
  flex:1;
  margin-left:3rem;
  font-size:13px;
}

.topbar-nav a{
  color:var(--text-dark);
  text-decoration:none;
  font-weight:500;
  cursor:pointer;
}

/* =========================================
BUTTONS (UNCHANGED)
========================================= */

.btn-login{
  border:1px solid var(--border);
  padding:8px 16px;
  background:var(--white);
}

.btn-getstarted{
  background:var(--red);
  color:#fff;
  border:none;
  padding:8px 16px;
}

/* =========================================
LAYOUT (UNCHANGED)
========================================= */

.container{
  max-width:1100px;
  margin:0 auto;
  padding:0 1.5rem;
}

.hero{
  background:linear-gradient(135deg,var(--navy),#0f2a3a);
  color:#fff;
  padding:4rem 2rem;
  margin:2rem 0;
  border-radius:8px;
  text-align:center;
}

/* cards, grid, etc remain untouched in your original file */

</style>
</head>

<body>

<div class="topbar-info">
  <a>Call sales</a>
  <a>Service Status</a>
  <a>Contact us</a>
  <a>About Moneris</a>
  <a>Careers</a>
</div>

<div class="topbar">
  <svg class="logo-svg" viewBox="0 0 160 52">
    <text x="0" y="38" font-size="30" font-weight="700">Moneris</text>
  </svg>

  <div class="topbar-nav">
    <a>Solutions</a>
    <a>Industries</a>
    <a>Partners</a>
    <a>Resources</a>
  </div>

  <div>
    <button class="btn-login">Login</button>
    <button class="btn-getstarted">Get Started</button>
  </div>
</div>

<div class="container">

<div class="hero">
  <h1>Moneris <span style="color:#E74C3C;">AI Product Selector</span></h1>
  <p>Describe your business and instantly get a recommended payment setup tailored to your industry.</p>
</div>

<div id="shell"></div>

</div>

<div class="footer">© 2026 Moneris Solutions Corporation</div>

<script>

/* =========================================
PRODUCT LIBRARY (UNCHANGED)
========================================= */

const P = {
goTerminal:{name:"Moneris Go Terminal",desc:"Portable smart terminal.",icon:"💳"},
goPlus:{name:"Moneris Go Plus",desc:"Smart POS with printer.",icon:"📱"},
goRetail:{name:"Moneris Go Retail",desc:"Retail POS system.",icon:"🛍️"},
totalCommerce:{name:"Moneris Total Commerce",desc:"Unified commerce platform.",icon:"🌐"},
goRestaurant:{name:"Moneris Go Restaurant",desc:"Restaurant POS system.",icon:"🍽️"},
touchBistro:{name:"Moneris + TouchBistro",desc:"Tableside restaurant payments.",icon:"🍷"},
monerisOnline:{name:"Moneris Online",desc:"Ecommerce payments.",icon:"💻"},
paydInvoicing:{name:"PAYD Invoicing",desc:"Remote invoicing solution.",icon:"📧"},
goPinPad:{name:"Moneris Go PIN Pad",desc:"Countertop payment device.",icon:"🔢"}
};

/* =========================================
INIT
========================================= */

renderAI("homepage");

/* =========================================
NAV
========================================= */

function startQuiz(industry){
  renderAI(industry);
  document.getElementById("shell").scrollIntoView({behavior:"smooth"});
}

/* =========================================
RENDER UI (UNCHANGED STRUCTURE)
========================================= */

function renderAI(industry){

document.getElementById("shell").innerHTML = `
<div class="card">

<div class="card-label">${industry.toUpperCase()}</div>

<div class="card-title">AI Product Selector</div>

<div class="card-subtitle">Describe your business...</div>

<textarea id="aiInput" class="form-input"></textarea>

<button onclick="runAI('${industry}')">Find my setup</button>

</div>
`;
}

/* =========================================
🔥 ONLY LOGIC UPGRADED (NO UI CHANGES)
========================================= */

function runAI(industry){

const text = document.getElementById("aiInput").value.toLowerCase();
if(!text.trim()) return;

/* KEEP ORIGINAL LOADING UI */
document.getElementById("shell").innerHTML = `
<div class="card">
<div class="card-title">Analyzing your business...</div>
<div class="pbar"><div class="pfill"></div></div>
</div>`;

setTimeout(()=>{

let recs = [];
let reasons = {};
let profile = {
industry,
channels:[],
goals:[],
size:"Small Business",
confidence:82
};

let enterprise =
text.includes("multi") ||
text.includes("franchise") ||
text.includes("enterprise") ||
text.includes("chain") ||
text.includes("locations");

/* ===== PROFILE ENGINE (UPGRADED) ===== */

if(text.includes("online") || text.includes("ecommerce")) profile.channels.push("Online");
if(text.includes("store") || text.includes("retail")) profile.channels.push("In-Store");
if(text.includes("mobile") || text.includes("on the go")) profile.channels.push("Mobile");
if(text.includes("grow") || text.includes("expand")) profile.goals.push("Growth");
if(text.includes("inventory")) profile.goals.push("Inventory");

if(enterprise){
profile.size = "Enterprise";
profile.confidence = 94;
}

/* ===== INDUSTRY LOGIC (UPGRADED ONLY) ===== */

if(industry === "retail"){
recs = enterprise
? ["goPinPad","totalCommerce","goRetail"]
: ["goRetail","goTerminal","totalCommerce"];

reasons.goRetail = "Retail POS for in-store sales and inventory.";
reasons.totalCommerce = "Unified online + in-store commerce.";
reasons.goTerminal = "Portable payments anywhere.";
}

else if(industry === "restaurant"){
recs = ["goRestaurant","goTerminal"];

if(text.includes("fine dining") || text.includes("tableside")){
recs.unshift("touchBistro");
reasons.touchBistro = "Tableside restaurant experience.";
}

reasons.goRestaurant = "Restaurant ordering and POS workflows.";
reasons.goTerminal = "Mobile payment flexibility.";
}

else if(industry === "health"){
recs = ["goPlus","goTerminal"];
}

else if(industry === "professional"){
recs = ["paydInvoicing","goTerminal"];
if(text.includes("online") || text.includes("remote")){
recs.unshift("monerisOnline");
}
}

else if(industry === "public"){
recs = ["goPinPad","monerisOnline","goTerminal"];
}

else if(industry === "nonprofit"){
recs = ["monerisOnline","paydInvoicing","goTerminal"];
}

else if(industry === "enterprise"){
recs = ["goPinPad","totalCommerce","monerisOnline"];
}

/* fallback */
else{
if(text.includes("restaurant")) return runAI("restaurant");
if(text.includes("spa")) return runAI("health");
return runAI("retail");
}

/* ===== SCORING (UNCHANGED STYLE) ===== */

let summary =
`Your business operates in ${industry} with ${
profile.channels.join(" + ") || "standard channels"}.`;

let score = 5;
if(profile.channels.length > 1) score += 2;
if(enterprise) score += 2;
if(profile.goals.length) score += 1;

/* ===== RENDER (YOUR ORIGINAL FUNCTION USED) ===== */

renderResults(recs, profile, summary, score, reasons);

},1200);
}

/* =========================================
RESULTS (UNCHANGED STRUCTURE EXPECTED)
========================================= */

function renderResults(recs, profile, summary, score, reasons){

const unique = [...new Set(recs)];

document.getElementById("shell").innerHTML = `
<div class="card">

<div class="card-title">AI RESULTS</div>

<div class="card-subtitle">${summary}</div>

<div class="product-grid">

${unique.map((k,i)=>{

const p = P[k];

return `
<div class="product-card">

<div class="product-icon">${p.icon}</div>

<div class="product-name">${p.name}</div>

<div class="product-desc">${p.desc}</div>

<div style="font-size:12px;">
${reasons[k] || "Recommended"}
</div>

<button>Learn more</button>

</div>`;
}).join("")}

</div>

<div style="font-size:32px;font-weight:700;">
Score: ${score}/10
</div>

</div>
`;
}

</script>

</body>
</html>
