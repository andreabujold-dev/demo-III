<script>

/* =========================================
PRODUCTS
========================================= */
const P = {
  goTerminal:{name:"Moneris Go Terminal",desc:"Portable smart terminal for line busting, curbside, and countertop payments.",icon:"💳"},
  goPlus:{name:"Moneris Go Plus",desc:"Smart all-in-one POS with built-in printer and touchscreen.",icon:"📱"},
  goRetail:{name:"Moneris Go Retail",desc:"Retail POS for inventory, staff, and in-store selling.",icon:"🛍️"},
  totalCommerce:{name:"Moneris Total Commerce",desc:"Unified commerce across in-store and online channels.",icon:"🌐"},
  goRestaurant:{name:"Moneris Go Restaurant",desc:"Restaurant POS built for cafés, QSRs, and food service.",icon:"🍽️"},
  touchBistro:{name:"Moneris + TouchBistro",desc:"Advanced restaurant management with tableside support.",icon:"🍷"},
  monerisOnline:{name:"Moneris Online",desc:"Sell online with integrated payments and ecommerce.",icon:"💻"},
  paydInvoicing:{name:"PAYD Invoicing",desc:"Send invoices and collect payments remotely.",icon:"📧"},
  goPinPad:{name:"Moneris Go PIN Pad",desc:"Countertop PIN pad for integrated POS environments.",icon:"🔢"}
};

/* =========================================
INDUSTRIES
========================================= */
const industries = {
  homepage:{
    title:"Moneris AI Product Matcher",
    subtitle:"Describe your business and we’ll recommend the right setup."
  },

  retail:{
    title:"Retail AI Advisor",
    subtitle:"Tell us about your retail business."
  },

  restaurant:{
    title:"Restaurant AI Advisor",
    subtitle:"Tell us about your restaurant operation."
  },

  health:{
    title:"Health & Beauty AI Advisor",
    subtitle:"Tell us about your salon, spa, or clinic."
  },

  enterprise:{
    title:"Enterprise AI Advisor",
    subtitle:"Tell us about your organization."
  },

  professional:{
    title:"Professional Services AI Advisor",
    subtitle:"Tell us about your business."
  },

  public:{
    title:"Public Sector AI Advisor",
    subtitle:"Tell us about your organization."
  },

  nonprofit:{
    title:"Not-for-profit AI Advisor",
    subtitle:"Tell us about your mission and operations."
  }
};

/* =========================================
STATE
========================================= */
let currentIndustry = "homepage";

/* =========================================
INIT
========================================= */
renderAI("homepage");

/* =========================================
INDUSTRY CARD CLICK
========================================= */
function startQuiz(industry){

  currentIndustry = industry;

  renderAI(industry);

  document.getElementById("shell")
    .scrollIntoView({behavior:"smooth"});
}

/* =========================================
RENDER AI SCREEN
========================================= */
function renderAI(industry){

  const cfg = industries[industry];

  const placeholders = {
    homepage:
`Example:
I run a small retail store and want better checkout and online payments.`,

    retail:
`Example:
I own a clothing boutique with 2 locations and around 1,000 SKUs. We want inventory syncing and online sales.`,

    restaurant:
`Example:
I run a café and want faster checkout, online ordering, and better staff management.`,

    health:
`Example:
I run a salon and want chairside payments, tipping, and appointment integrations.`,

    enterprise:
`Example:
We operate 35 locations across Canada and need centralized reporting and enterprise support.`,

    professional:
`Example:
I own an accounting firm and want invoicing plus remote payments.`,

    public:
`Example:
We’re a municipality looking to modernize in-person and online payments.`,

    nonprofit:
`Example:
We run a charity and need online donations plus affordable in-person payments.`
  };

  document.getElementById("shell").innerHTML = `

  <div class="card">

    <div class="card-label">
      ${industry === "homepage"
        ? "AI EXPERIENCE"
        : industry.toUpperCase()}
    </div>

    <div class="card-title">
      ${cfg.title}
    </div>

    <div class="card-subtitle">
      ${cfg.subtitle}
    </div>

    <div style="
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:16px;
    ">

      <span class="path-badge">AI powered</span>

      ${
        industry !== "homepage"
        ? `<span class="ep-badge ep-b">${industry}</span>`
        : ``
      }

    </div>

    <textarea
      id="aiInput"
      class="form-input"
      style="
        min-height:180px;
        resize:vertical;
        padding:16px;
        line-height:1.6;
      "
      placeholder="${placeholders[industry]}"
    ></textarea>

    <div style="
      display:flex;
      gap:10px;
      margin-top:18px;
      flex-wrap:wrap;
    ">

      <button
        class="btn-submit"
        onclick="runAI('${industry}')"
      >
        Find my setup
      </button>

      ${
        industry !== "homepage"
        ? `
        <button
          class="btn-outline"
          style="width:auto;"
          onclick="renderAI('homepage')"
        >
          Back to homepage
        </button>
        `
        : `
        <button
          class="btn-outline"
          style="width:auto;"
          onclick="showClassicQuiz()"
        >
          Classic quiz
        </button>
        `
      }

    </div>

  </div>
  `;
}

/* =========================================
FAKE AI ENGINE
========================================= */
function runAI(industry){

  const text = document
    .getElementById("aiInput")
    .value
    .toLowerCase();

  if(!text.trim()) return;

  document.getElementById("shell").innerHTML = `

  <div class="card">

    <div class="card-label">
      AI ANALYSIS
    </div>

    <div class="card-title">
      Analyzing your business...
    </div>

    <div class="card-subtitle">
      Matching your needs against Moneris solutions.
    </div>

    <div class="pbar">
      <div class="pfill" style="width:100%"></div>
    </div>

  </div>
  `;

  setTimeout(() => {

    let recs = [];
    let enterprise = false;

    /* =========================================
    UNIVERSAL DETECTION
    ========================================= */

    if(
      text.includes("multi") ||
      text.includes("locations") ||
      text.includes("enterprise") ||
      text.includes("franchise") ||
      text.includes("100+") ||
      text.includes("chain")
    ){
      enterprise = true;
    }

    /* =========================================
    RETAIL
    ========================================= */

    if(industry === "retail"){

      recs.push("goRetail");
      recs.push("goTerminal");

      if(
        text.includes("online") ||
        text.includes("ecommerce") ||
        text.includes("shopify")
      ){
        recs.unshift("totalCommerce");
      }

      if(enterprise){
        recs.unshift("goPinPad");
      }
    }

    /* =========================================
    RESTAURANT
    ========================================= */

    else if(industry === "restaurant"){

      recs.push("goRestaurant");
      recs.push("goTerminal");

      if(
        text.includes("full service") ||
        text.includes("tableside") ||
        text.includes("fine dining")
      ){
        recs.unshift("touchBistro");
      }
    }

    /* =========================================
    HEALTH
    ========================================= */

    else if(industry === "health"){

      recs.push("goPlus");
      recs.push("goTerminal");

      if(
        text.includes("retail") ||
        text.includes("products")
      ){
        recs.unshift("goRetail");
      }
    }

    /* =========================================
    PROFESSIONAL
    ========================================= */

    else if(industry === "professional"){

      recs.push("paydInvoicing");
      recs.push("goTerminal");

      if(
        text.includes("online") ||
        text.includes("remote")
      ){
        recs.unshift("monerisOnline");
      }
    }

    /* =========================================
    PUBLIC
    ========================================= */

    else if(industry === "public"){

      recs.push("goPinPad");
      recs.push("monerisOnline");
      recs.push("goTerminal");
    }

    /* =========================================
    NONPROFIT
    ========================================= */

    else if(industry === "nonprofit"){

      recs.push("monerisOnline");
      recs.push("paydInvoicing");
      recs.push("goTerminal");
    }

    /* =========================================
    ENTERPRISE
    ========================================= */

    else if(industry === "enterprise"){

      enterprise = true;

      recs.push("goPinPad");
      recs.push("totalCommerce");
      recs.push("monerisOnline");
    }

    /* =========================================
    HOMEPAGE AUTO-DETECTION
    ========================================= */

    else {

      if(
        text.includes("restaurant") ||
        text.includes("cafe") ||
        text.includes("food")
      ){
        industry = "restaurant";
      }

      else if(
        text.includes("salon") ||
        text.includes("spa") ||
        text.includes("clinic")
      ){
        industry = "health";
      }

      else if(
        text.includes("government") ||
        text.includes("municipal")
      ){
        industry = "public";
      }

      else if(
        text.includes("charity") ||
        text.includes("donation")
      ){
        industry = "nonprofit";
      }

      else if(
        text.includes("law") ||
        text.includes("accounting") ||
        text.includes("firm")
      ){
        industry = "professional";
      }

      else {
        industry = "retail";
      }

      runAI(industry);

      return;
    }

    renderResults(recs, enterprise, industry);

  }, 1400);
}

/* =========================================
RESULTS
========================================= */
function renderResults(recs, enterprise, industry){

  const unique = [...new Set(recs)];

  document.getElementById("shell").innerHTML = `

  <div class="card">

    <span class="ep-badge ${
      enterprise ? "ep-b" : "ep-g"
    }">

      ${
        enterprise
        ? "Enterprise recommendation"
        : "Recommended setup"
      }

    </span>

    <div class="card-title">
      Here's what we'd recommend.
    </div>

    <div class="card-subtitle">

      ${
        enterprise
        ? "Based on your scale and operational needs, these solutions are the strongest fit."
        : "Based on your business goals, these solutions are the best fit."
      }

    </div>

    <div class="product-grid">

      ${unique.map((k, i) => {

        const p = P[k];

        return `

        <div class="product-card ${i===0?'best':''}">

          ${
            i===0
            ? `<div class="product-badge">Best option</div>`
            : `<div style="height:28px;"></div>`
          }

          <div class="product-icon">
            ${p.icon}
          </div>

          <div class="product-name">
            ${p.name}
          </div>

          <div class="product-desc">
            ${p.desc}
          </div>

          <button class="btn-primary">
            Learn more
          </button>

          <button class="btn-outline">
            Talk to sales
          </button>

        </div>

        `;

      }).join("")}

    </div>

    ${
      enterprise
      ? `
      <div class="dvd"></div>

      <div class="card-subtitle" style="margin-bottom:18px;">
        Your requirements may benefit from a tailored enterprise setup.
      </div>

      <div class="contact-form">

        <div class="form-row">

          <div class="form-group">
            <div class="form-label">First name</div>
            <input class="form-input" placeholder="Jane">
          </div>

          <div class="form-group">
            <div class="form-label">Last name</div>
            <input class="form-input" placeholder="Smith">
          </div>

        </div>

        <div class="form-group">
          <div class="form-label">Business email</div>
          <input class="form-input" placeholder="jane@company.com">
        </div>

        <button class="btn-submit">
          Contact enterprise sales
        </button>

      </div>
      `
      : ``
    }

    <div class="dvd"></div>

    <div style="
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    ">

      <button
        class="btn-outline"
        style="width:auto;"
        onclick="renderAI('${industry}')"
      >
        Try again
      </button>

      <button
        class="btn-outline"
        style="width:auto;"
        onclick="renderAI('homepage')"
      >
        Homepage
      </button>

    </div>

  </div>
  `;
}

/* =========================================
OPTIONAL CLASSIC QUIZ PLACEHOLDER
========================================= */
function showClassicQuiz(){

  document.getElementById("shell").innerHTML = `

  <div class="card">

    <div class="card-label">
      CLASSIC EXPERIENCE
    </div>

    <div class="card-title">
      Step-by-step quiz coming soon.
    </div>

    <div class="card-subtitle">
      This demo currently focuses on the AI-guided experience.
    </div>

    <button
      class="btn-submit"
      onclick="renderAI('homepage')"
    >
      Back to AI experience
    </button>

  </div>
  `;
}

</script>
